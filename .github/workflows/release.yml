name: Release macOS App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish MAC-macOS.zip
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Test Suites
        run: npm test

      - name: Build Portable MAC.app
        env:
          MAC_PORTABLE_BUILD: "1"
        run: npm run build:app

      - name: Package MAC-macOS.zip
        run: ditto -c -k --sequesterRsrc --keepParent MAC.app MAC-macOS.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MAC-macOS.zip
          generate_release_notes: true
