name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  macos-app-and-tests:
    name: macOS Native App (MAC.app) & Full Test Suite
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Node.js & Swift Automated Test Suites
        run: npm test

      - name: Build Native MAC.app Bundle
        env:
          MAC_PORTABLE_BUILD: "1"
        run: npm run build:app
